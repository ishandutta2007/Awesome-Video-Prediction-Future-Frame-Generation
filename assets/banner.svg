<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18" />
      <stop offset="50%" stop-color="#10102e" />
      <stop offset="100%" stop-color="#070712" />
    </linearGradient>

    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#b92b27" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f244a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d1127" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .bg-grid {
        stroke: #2a2e5a;
        stroke-width: 0.8;
        stroke-opacity: 0.35;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .flowing-wave {
        animation: waveShift 10s linear infinite;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dashMove 6s linear infinite;
      }
      .glow-node {
        animation: nodePulse 3s ease-in-out infinite alternate;
      }
      .card-float-1 {
        animation: floatOne 5s ease-in-out infinite alternate;
      }
      .card-float-2 {
        animation: floatTwo 6s ease-in-out infinite alternate;
      }
      .card-float-3 {
        animation: floatThree 5.5s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: badgePulse 3.5s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.25; }
        100% { transform: scale(1.18); opacity: 0.45; }
      }
      @keyframes waveShift {
        0% { transform: translateX(0); }
        100% { transform: translateX(-300px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -50; }
      }
      @keyframes nodePulse {
        0% { r: 5; opacity: 0.6; }
        100% { r: 9; opacity: 1; }
      }
      @keyframes floatOne {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes floatThree {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 2px #00f2fe); }
        100% { filter: drop-shadow(0 0 10px #4facfe); }
      }
    </style>
  </defs>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Dynamic Animated Tech Background Layer -->
  <g id="background-dynamics" opacity="0.85">
    <!-- Isometric Grid -->
    <g class="bg-grid">
      <line x1="0" y1="70" x2="1200" y2="70" />
      <line x1="0" y1="140" x2="1200" y2="140" />
      <line x1="0" y1="210" x2="1200" y2="210" />
      <line x1="0" y1="280" x2="1200" y2="280" />
      <line x1="0" y1="350" x2="1200" y2="350" />
      <line x1="120" y1="0" x2="120" y2="420" />
      <line x1="240" y1="0" x2="240" y2="420" />
      <line x1="360" y1="0" x2="360" y2="420" />
      <line x1="480" y1="0" x2="480" y2="420" />
      <line x1="600" y1="0" x2="600" y2="420" />
      <line x1="720" y1="0" x2="720" y2="420" />
      <line x1="840" y1="0" x2="840" y2="420" />
      <line x1="960" y1="0" x2="960" y2="420" />
      <line x1="1080" y1="0" x2="1080" y2="420" />
    </g>

    <!-- Animated Ambient Nebulas -->
    <circle cx="180" cy="110" r="140" fill="#00f2fe" class="pulse-circle" opacity="0.15" filter="url(#glow)" />
    <circle cx="1040" cy="300" r="160" fill="#7928ca" class="pulse-circle" opacity="0.18" filter="url(#glow)" />
    <circle cx="920" cy="90" r="120" fill="#00dfd8" class="pulse-circle" opacity="0.12" filter="url(#glow)" />

    <!-- Latent Flow Connecting Paths -->
    <path d="M 0,330 Q 300,270 600,340 T 1200,310" fill="none" stroke="#00f2fe" stroke-width="2" class="dash-flow" opacity="0.5" />
    <path d="M 0,350 Q 320,380 650,330 T 1200,360" fill="none" stroke="#7928ca" stroke-width="2.5" class="dash-flow" opacity="0.4" />
  </g>

  <!-- Interactive Graphic Floating Flow Elements (Bottom Lateral Sides) -->
  <g id="lateral-cards" opacity="0.88">
    <!-- Left Card: Frame Extrapolation Graph -->
    <g class="card-float-1" transform="translate(60, 260)" filter="url(#cardShadow)">
      <rect width="180" height="96" rx="14" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="1">NEXT-FRAME DiT</text>
      <!-- Timeline dots -->
      <circle cx="28" cy="62" r="6" fill="#4facfe" />
      <line x1="34" y1="62" x2="62" y2="62" stroke="#4facfe" stroke-width="2" class="dash-flow" />
      <circle cx="68" cy="62" r="7" fill="#00f2fe" />
      <line x1="75" y1="62" x2="103" y2="62" stroke="#38ef7d" stroke-width="2" class="dash-flow" />
      <circle cx="110" cy="62" r="9" fill="#38ef7d" class="glow-node" />
      <text x="110" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a0aec0">T+N Future</text>
      <text x="28" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#718096">T0 Frame</text>
    </g>

    <!-- Right Card: Autoregressive Rollout -->
    <g class="card-float-2" transform="translate(960, 260)" filter="url(#cardShadow)">
      <rect width="180" height="96" rx="14" fill="url(#cardGrad)" stroke="#9f7aea" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b794f4" letter-spacing="1">WORLD DYNAMICS</text>
      <path d="M 22,66 C 45,45 65,75 88,52 C 110,35 130,68 156,48" fill="none" stroke="#9f7aea" stroke-width="2.5" class="dash-flow" />
      <circle cx="156" cy="48" r="6" fill="#38ef7d" class="glow-node" />
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a0aec0">Infinite Horizon Rollout ⚡</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Pristine, Readable, High-Contrast Hero Typography -->
  <g id="hero-foreground">
    <!-- Top Category Pill / Kicker -->
    <g transform="translate(600, 72)">
      <rect x="-185" y="-18" width="370" height="34" rx="17" fill="#141838" stroke="#00f2fe" stroke-width="1.5" class="badge-glow" />
      <circle cx="-160" cy="-1" r="5" fill="#38ef7d" class="glow-node" />
      <text x="8" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="1.8">
        STATE-OF-THE-ART VIDEO PREDICTION &amp; I2V
      </text>
    </g>

    <!-- Main Title: Awesome Video Prediction -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#cardShadow)">
      Awesome Video Prediction
    </text>

    <!-- Subtitle: Future Frame Generation Ecosystem -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#neonCyanPurple)" letter-spacing="0.2">
      Future Frame Generation Ecosystem
    </text>

    <!-- Clear Value Proposition Tagline -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#cbd5e0" letter-spacing="0.4">
      Image-to-Video Synthesis • Causal Autoregressive Prediction • First-to-Last Frame Interpolation • World Models
    </text>

    <!-- Feature Attribute Micro-Badges -->
    <g transform="translate(600, 310)">
      <!-- Badge 1: 30+ OSS Repos -->
      <g transform="translate(-250, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#181e42" stroke="#4facfe" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#63b3ed">⭐ 38+ Open Source</text>
      </g>
      <!-- Badge 2: SaaS Video Studios -->
      <g transform="translate(-75, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#181e42" stroke="#9f7aea" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d6bcfa">☁️ Top 11 SaaS</text>
      </g>
      <!-- Badge 3: World Sim & DiT -->
      <g transform="translate(100, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#181e42" stroke="#38ef7d" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#68d391">🧠 World Dynamics</text>
      </g>
      <!-- Badge 4: Real-time Frame-Pack -->
      <g transform="translate(265, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#181e42" stroke="#f6ad55" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbd38d">⚡ Frame-Pack DiT</text>
      </g>
    </g>

    <!-- Bottom Accent Border Glow -->
    <rect x="0" y="415" width="1200" height="5" fill="url(#neonCyanPurple)" />
  </g>
</svg>
